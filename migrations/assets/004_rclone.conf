# rclone remotes for migration 004 (sync prod -> stage)
#
# Design: two named remotes, one per AWS account, so a single rclone invocation
# can hold two concurrent identities (creds never mix).
#
#   stage : ambient credential chain (e.g. TimdexManager@stage creds in terminal,
#           via AWS_PROFILE / env vars) -- readwrite, owns the target bucket.
#   prod  : the 'timmy-prod' AWS profile from ~/.aws/config, which assumes the
#           readonly timmy prod role using the timmy IAM user keys in
#           ~/.aws/credentials.  The stage SSO role is not trusted to assume
#           that role, so the profile is used directly.
#
# KMS / checksum notes: both buckets use SSE-KMS, so S3 ETags are NOT MD5s of the
# object data.
#   prod  : 'server_side_encryption = aws:kms' tells rclone not to treat prod
#           ETags as MD5s (otherwise it sends them as a bogus Content-MD5 on
#           upload -> BadDigest).  No key ID needed; rclone never writes to prod.
#   stage : no SSE settings, so the bucket default key (alias/mitlib/s3) applies.
#           'use_multipart_etag = false' skips the multipart ETag verification
#           that cannot pass under KMS.

[prod]
type = s3
provider = AWS
env_auth = true
profile = timmy-prod
region = us-east-1
server_side_encryption = aws:kms

[stage]
type = s3
provider = AWS
env_auth = true
region = us-east-1
use_multipart_etag = false

# Usage note: point rclone at this file explicitly so nothing depends on
# ~/.config/rclone/rclone.conf:
#
#   rclone --config migrations/assets/004_rclone.conf sync \
#     --progress \
#     --transfers 16 \
#     --checkers 32 \
#     prod:$TIMDEX_PROD_BUCKET/dataset/ \
#     stage:$TIMDEX_STAGE_BUCKET/dataset/